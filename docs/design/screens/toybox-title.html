<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toybox Pixel title and mode select</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
html,body{margin:0;background:#26232E}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:56px 32px 32px;box-sizing:border-box}
#dc-root{flex:none}
.dc-back{position:fixed;top:12px;left:12px;z-index:10;font:600 13px system-ui,sans-serif;color:#EDEAF5;text-decoration:none;background:rgba(255,255,255,0.1);padding:8px 12px;border-radius:8px}
.dc-back:hover{background:rgba(255,255,255,0.18)}
</style>
<style>
body{margin:0}
a{color:#2B1D52}a:hover{color:#1A1035}
@keyframes tbBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.tb-food{animation:tbBounce 0.9s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.tb-food{animation:none}}
</style>
</head>
<body>
<a class="dc-back" href="../index.html">&#8592; All screens</a>
<div id="dc-root"></div>
<template id="dc-template">
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 28px 15px 32px; display: flex; flex-direction: column; gap: 16px; background: #FFC93C; color: #2B1D52; font-family: 'Pixelify Sans', 'Courier New', monospace">
  <h1 style="margin: 0; text-align: center; font-size: 76px; line-height: 1; font-weight: 700; letter-spacing: 0.04em; text-shadow: 5px 5px 0 #FF6B4A">Snake</h1>
  <div role="img" aria-label="Attract mode: the snake plays by itself until someone presses Play" style="position: relative; width: 360px; height: 162px; margin-bottom: 12px; border-radius: 6px; background: repeating-conic-gradient(#1F6E7A 0 25%, #1A6170 0 50%) 0 0 / 36px 36px; box-shadow: 0 0 0 6px #2B1D52, 0 12px 0 6px #1A1035">
    <sc-for list="{{segs}}" as="s" hint-placeholder-count="18">
      <sc-if value="{{s.even}}" hint-placeholder-val="{{true}}">
        <div style="position: absolute; left: {{s.l}}px; top: {{s.t}}px; width: 18px; height: 18px; border-radius: 4px; background: {{s.bg}}; box-shadow: inset 0 -3px 0 rgba(43,29,82,0.28)"></div>
      </sc-if>
      <sc-if value="{{s.odd}}" hint-placeholder-val="{{false}}">
        <div style="position: absolute; left: {{s.l}}px; top: {{s.t}}px; width: 18px; height: 18px; border-radius: 4px; background: #FFF1D6; box-shadow: inset 0 -3px 0 rgba(43,29,82,0.22)"></div>
      </sc-if>
    </sc-for>
    <div style="position: absolute; left: 270px; top: 54px; width: 18px; height: 18px; border-radius: 6px; background: {{snake}}; box-shadow: inset 0 -3px 0 rgba(43,29,82,0.28)">
      <div style="position: absolute; left: 9px; top: 2px; width: 6px; height: 6px; border-radius: 1px; background: #FFFFFF"></div>
      <div style="position: absolute; left: 9px; top: 10px; width: 6px; height: 6px; border-radius: 1px; background: #FFFFFF"></div>
      <div style="position: absolute; left: 12px; top: 3px; width: 3px; height: 3px; background: #2B1D52"></div>
      <div style="position: absolute; left: 12px; top: 11px; width: 3px; height: 3px; background: #2B1D52"></div>
      <div style="position: absolute; left: 18px; top: 8px; width: 6px; height: 2px; background: #FF2E63"></div>
    </div>
    <div class="tb-food" style="position: absolute; left: 326px; top: 56px; width: 14px; height: 14px">
      <div style="position: absolute; left: 0; top: 0; width: 14px; height: 14px; border-radius: 50%; background: #4C6BFF; box-shadow: inset -2px -2px 0 rgba(43,29,82,0.35)"></div>
      <div style="position: absolute; left: 3px; top: 3px; width: 4px; height: 4px; border-radius: 1px; background: #DDE3FF"></div>
      <div style="position: absolute; left: 5px; top: -4px; width: 6px; height: 4px; border-radius: 2px; background: #5BD16A"></div>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 10px">
    <h2 style="margin: 0; font-size: 17px; font-weight: 600">Choose a mode</h2>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <sc-if value="{{easySel}}" hint-placeholder-val="{{true}}">
        <button onClick="{{pickEasy}}" aria-pressed="true" style="height: 60px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 0 14px; border-radius: 12px; border: 3px solid #2B1D52; background: #FF6B4A; color: #2B1D52; font-family: inherit; text-align: left; box-shadow: 0 4px 0 #1A1035; cursor: pointer">
          <span style="display: flex; flex-direction: column; gap: 2px; flex: 1"><span style="font-size: 20px; font-weight: 700">Easy</span><span style="font-size: 14px; font-weight: 500">Slower snake. Walls wrap around.</span></span>
          <svg width="22" height="22" viewBox="0 0 22 22" fill="#2B1D52" aria-hidden="true"><rect x="2" y="10" width="4" height="4"></rect><rect x="6" y="14" width="4" height="4"></rect><rect x="10" y="10" width="4" height="4"></rect><rect x="14" y="6" width="4" height="4"></rect><rect x="18" y="2" width="4" height="4"></rect></svg>
        </button>
      </sc-if>
      <sc-if value="{{easyUnsel}}" hint-placeholder-val="{{false}}">
        <button onClick="{{pickEasy}}" aria-pressed="false" style="height: 60px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 0 14px; border-radius: 12px; border: 3px solid #2B1D52; background: #FFF1D6; color: #2B1D52; font-family: inherit; text-align: left; box-shadow: 0 4px 0 #1A1035; cursor: pointer">
          <span style="display: flex; flex-direction: column; gap: 2px; flex: 1"><span style="font-size: 20px; font-weight: 700">Easy</span><span style="font-size: 14px; font-weight: 500">Slower snake. Walls wrap around.</span></span>
        </button>
      </sc-if>
      <sc-if value="{{classicSel}}" hint-placeholder-val="{{false}}">
        <button onClick="{{pickClassic}}" aria-pressed="true" style="height: 60px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 0 14px; border-radius: 12px; border: 3px solid #2B1D52; background: #FF6B4A; color: #2B1D52; font-family: inherit; text-align: left; box-shadow: 0 4px 0 #1A1035; cursor: pointer">
          <span style="display: flex; flex-direction: column; gap: 2px; flex: 1"><span style="font-size: 20px; font-weight: 700">Classic</span><span style="font-size: 14px; font-weight: 500">Faster snake. Walls end the game.</span></span>
          <svg width="22" height="22" viewBox="0 0 22 22" fill="#2B1D52" aria-hidden="true"><rect x="2" y="10" width="4" height="4"></rect><rect x="6" y="14" width="4" height="4"></rect><rect x="10" y="10" width="4" height="4"></rect><rect x="14" y="6" width="4" height="4"></rect><rect x="18" y="2" width="4" height="4"></rect></svg>
        </button>
      </sc-if>
      <sc-if value="{{classicUnsel}}" hint-placeholder-val="{{true}}">
        <button onClick="{{pickClassic}}" aria-pressed="false" style="height: 60px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 0 14px; border-radius: 12px; border: 3px solid #2B1D52; background: #FFF1D6; color: #2B1D52; font-family: inherit; text-align: left; box-shadow: 0 4px 0 #1A1035; cursor: pointer">
          <span style="display: flex; flex-direction: column; gap: 2px; flex: 1"><span style="font-size: 20px; font-weight: 700">Classic</span><span style="font-size: 14px; font-weight: 500">Faster snake. Walls end the game.</span></span>
        </button>
      </sc-if>
      <button disabled style="height: 60px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 0 14px; border-radius: 12px; border: 3px dashed rgba(43,29,82,0.55); background: transparent; color: #2B1D52; font-family: inherit; text-align: left; cursor: not-allowed">
        <span style="display: flex; flex-direction: column; gap: 2px; flex: 1"><span style="font-size: 20px; font-weight: 700">Portals</span><span style="font-size: 14px; font-weight: 500">Unlocks at 2,000 in Classic</span></span>
        <svg width="20" height="22" viewBox="0 0 20 22" fill="#2B1D52" aria-label="Locked" role="img"><rect x="5" y="2" width="10" height="3"></rect><rect x="3" y="5" width="3" height="6"></rect><rect x="14" y="5" width="3" height="6"></rect><rect x="1" y="10" width="18" height="11"></rect></svg>
      </button>
      <button disabled style="height: 60px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 0 14px; border-radius: 12px; border: 3px dashed rgba(43,29,82,0.55); background: transparent; color: #2B1D52; font-family: inherit; text-align: left; cursor: not-allowed">
        <span style="display: flex; flex-direction: column; gap: 2px; flex: 1"><span style="font-size: 20px; font-weight: 700">Hot potato</span><span style="font-size: 14px; font-weight: 500">Unlocks at 3,000 in Classic</span></span>
        <svg width="20" height="22" viewBox="0 0 20 22" fill="#2B1D52" aria-label="Locked" role="img"><rect x="5" y="2" width="10" height="3"></rect><rect x="3" y="5" width="3" height="6"></rect><rect x="14" y="5" width="3" height="6"></rect><rect x="1" y="10" width="18" height="11"></rect></svg>
      </button>
    </div>
  </div>
  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 14px">
    <a href="toybox-gameplay.html" style="height: 62px; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: #2B1D52; color: #FFF1D6; font-size: 28px; font-weight: 700; text-decoration: none; box-shadow: 0 6px 0 #1A1035">Play</a>
    <div style="display: flex; gap: 10px">
      <a href="toybox-leaderboard.html" style="flex: 1; height: 50px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 12px; border: 3px solid #2B1D52; background: #FFF1D6; color: #2B1D52; font-size: 18px; font-weight: 700; text-decoration: none; box-shadow: 0 4px 0 #1A1035">Leaderboard</a>
      <button aria-label="Settings" style="width: 50px; height: 50px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; padding: 0; border-radius: 12px; border: 3px solid #2B1D52; background: #FFF1D6; color: #2B1D52; box-shadow: 0 4px 0 #1A1035; cursor: pointer">
        <svg width="22" height="20" viewBox="0 0 22 20" fill="currentColor" aria-hidden="true"><rect x="0" y="3" width="22" height="2"></rect><rect x="5" y="0" width="5" height="8"></rect><rect x="0" y="15" width="22" height="2"></rect><rect x="13" y="12" width="5" height="8"></rect></svg>
      </button>
    </div>
  </div>
</div>
</template>
<script src="dc-lite.js"></script>
<script>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const mode = s.mode || 'easy';
    const snake = '#FF6B4A';
    const C = 18;
    const cells = [[15,3],[14,3],[13,3],[12,3],[12,4],[12,5],[11,5],[10,5],[9,5],[8,5],[8,4],[8,3],[7,3],[6,3],[5,3],[4,3],[4,4],[4,5],[4,6]];
    const segs = cells.slice(1).map((c, i) => ({ l: c[0] * C, t: c[1] * C, even: i % 2 === 1, odd: i % 2 === 0, bg: snake }));
    return {
      snake: snake,
      segs: segs,
      easySel: mode === 'easy',
      easyUnsel: mode !== 'easy',
      classicSel: mode === 'classic',
      classicUnsel: mode !== 'classic',
      pickEasy: () => this.setState({ mode: 'easy' }),
      pickClassic: () => this.setState({ mode: 'classic' })
    };
  }
}
dcBoot(Component, {"$preview": {"width": 390, "height": 844}});
</script>
</body>
</html>
