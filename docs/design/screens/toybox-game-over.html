<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toybox Pixel game over</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
html,body{margin:0;background:#26232E}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:56px 32px 32px;box-sizing:border-box}
#dc-root{flex:none}
.dc-back{position:fixed;top:12px;left:12px;z-index:10;font:600 13px system-ui,sans-serif;color:#EDEAF5;text-decoration:none;background:rgba(255,255,255,0.1);padding:8px 12px;border-radius:8px}
.dc-back:hover{background:rgba(255,255,255,0.18)}
</style>
<style>
body{margin:0}
a{color:#2B1D52}a:hover{color:#1A1035}
@keyframes tbFlash{50%{opacity:0.35}}
.tb-flash{animation:tbFlash 0.5s steps(1) infinite}
@media (prefers-reduced-motion: reduce){.tb-flash{animation:none}}
</style>
</head>
<body>
<a class="dc-back" href="../index.html">&#8592; All screens</a>
<div id="dc-root"></div>
<template id="dc-template">
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 28px 15px 32px; display: flex; flex-direction: column; gap: 16px; background: #FFC93C; color: #2B1D52; font-family: 'Pixelify Sans', 'Courier New', monospace">
  <h1 style="margin: 0; text-align: center; font-size: 48px; line-height: 1; font-weight: 700; text-shadow: 4px 4px 0 #FF6B4A">Game over</h1>
  <div role="img" aria-label="The snake has bumped into the right-hand wall and its tail is popping away" style="position: relative; width: 360px; height: 360px; margin-bottom: 12px; border-radius: 6px; background: repeating-conic-gradient(#1F6E7A 0 25%, #1A6170 0 50%) 0 0 / 36px 36px; box-shadow: 0 0 0 6px #2B1D52, 0 12px 0 6px #1A1035">
    <sc-for list="{{segs}}" as="s" hint-placeholder-count="10">
      <div class="tb-flash" style="position: absolute; left: {{s.l}}px; top: {{s.t}}px; width: 18px; height: 18px; border-radius: 4px; background: {{s.bg}}; box-shadow: inset 0 -3px 0 rgba(43,29,82,0.25)"></div>
    </sc-for>
    <sc-for list="{{bits}}" as="b" hint-placeholder-count="12">
      <div style="position: absolute; left: {{b.l}}px; top: {{b.t}}px; width: 6px; height: 6px; border-radius: 1px; background: {{b.bg}}"></div>
    </sc-for>
    <div style="position: absolute; left: 342px; top: 144px; width: 18px; height: 18px; border-radius: 6px; background: #FF6B4A; box-shadow: inset 0 -3px 0 rgba(43,29,82,0.28)">
      <div style="position: absolute; left: 9px; top: 2px; width: 2px; height: 2px; background: #2B1D52"></div>
      <div style="position: absolute; left: 13px; top: 2px; width: 2px; height: 2px; background: #2B1D52"></div>
      <div style="position: absolute; left: 11px; top: 4px; width: 2px; height: 2px; background: #2B1D52"></div>
      <div style="position: absolute; left: 9px; top: 6px; width: 2px; height: 2px; background: #2B1D52"></div>
      <div style="position: absolute; left: 13px; top: 6px; width: 2px; height: 2px; background: #2B1D52"></div>
      <div style="position: absolute; left: 9px; top: 10px; width: 2px; height: 2px; background: #2B1D52"></div>
      <div style="position: absolute; left: 13px; top: 10px; width: 2px; height: 2px; background: #2B1D52"></div>
      <div style="position: absolute; left: 11px; top: 12px; width: 2px; height: 2px; background: #2B1D52"></div>
      <div style="position: absolute; left: 9px; top: 14px; width: 2px; height: 2px; background: #2B1D52"></div>
      <div style="position: absolute; left: 13px; top: 14px; width: 2px; height: 2px; background: #2B1D52"></div>
    </div>
    <div style="position: absolute; left: 336px; top: 128px; width: 4px; height: 4px; background: #FFF1D6"></div>
    <div style="position: absolute; left: 352px; top: 122px; width: 6px; height: 6px; background: #FFC93C"></div>
    <div style="position: absolute; left: 332px; top: 168px; width: 6px; height: 6px; background: #FFC93C"></div>
    <div style="position: absolute; left: 350px; top: 172px; width: 4px; height: 4px; background: #FFF1D6"></div>
    <div style="position: absolute; left: 74px; top: 74px; width: 14px; height: 14px">
      <div style="position: absolute; left: 0; top: 0; width: 14px; height: 14px; border-radius: 50%; background: #4C6BFF; box-shadow: inset -2px -2px 0 rgba(43,29,82,0.35)"></div>
      <div style="position: absolute; left: 3px; top: 3px; width: 4px; height: 4px; border-radius: 1px; background: #DDE3FF"></div>
      <div style="position: absolute; left: 5px; top: -4px; width: 6px; height: 4px; border-radius: 2px; background: #5BD16A"></div>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 12px; padding: 18px; border-radius: 18px; border: 4px solid #2B1D52; background: #FFF1D6; box-shadow: 0 6px 0 #1A1035">
    <div style="display: flex; justify-content: space-between; align-items: flex-end">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 15px; font-weight: 500">Score</span>
        <span style="font-size: 44px; line-height: 1; font-weight: 700">000420</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px; align-items: flex-end">
        <span style="font-size: 15px; font-weight: 500">Best</span>
        <span style="font-size: 22px; line-height: 1; font-weight: 700; padding: 6px 10px; border-radius: 8px; background: #2B1D52; color: #FFF1D6">001480</span>
      </div>
    </div>
    <span style="font-size: 17px; font-weight: 600">1,060 more to beat your best.</span>
  </div>
  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px">
    <a href="toybox-gameplay.html" style="height: 60px; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: #2B1D52; color: #FFF1D6; font-size: 26px; font-weight: 700; text-decoration: none; box-shadow: 0 6px 0 #1A1035">Play again</a>
    <a href="toybox-title.html" style="height: 50px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 12px; border: 3px solid #2B1D52; background: #FFF1D6; color: #2B1D52; font-size: 18px; font-weight: 700; text-decoration: none; box-shadow: 0 4px 0 #1A1035">Menu</a>
  </div>
</div>
</template>
<script src="dc-lite.js"></script>
<script>
class Component extends DCLogic {
  renderVals() {
    const C = 18;
    const body = [[18,8],[17,8],[16,8],[15,8],[15,9],[15,10],[14,10],[13,10],[12,10],[11,10]];
    const popped = [[11,9],[11,8],[11,7],[10,7]];
    const segs = body.map((c, i) => ({ l: c[0] * C, t: c[1] * C, bg: i % 2 === 0 ? '#FFF1D6' : '#FF6B4A' }));
    const bits = [];
    popped.forEach((c, i) => {
      const x = c[0] * C;
      const y = c[1] * C;
      const a = i % 2 === 0 ? '#FF6B4A' : '#FFF1D6';
      const b = i % 2 === 0 ? '#FFF1D6' : '#FF6B4A';
      bits.push({ l: x + 1 - i, t: y + 1, bg: a });
      bits.push({ l: x + 11, t: y + 2 - i, bg: b });
      bits.push({ l: x + 5 - i, t: y + 11 + i, bg: a });
    });
    return { segs: segs, bits: bits };
  }
}
dcBoot(Component, {"$preview": {"width": 390, "height": 844}});
</script>
</body>
</html>
