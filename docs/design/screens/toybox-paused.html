<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toybox Pixel paused</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
html,body{margin:0;background:#26232E}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:56px 32px 32px;box-sizing:border-box}
#dc-root{flex:none}
.dc-back{position:fixed;top:12px;left:12px;z-index:10;font:600 13px system-ui,sans-serif;color:#EDEAF5;text-decoration:none;background:rgba(255,255,255,0.1);padding:8px 12px;border-radius:8px}
.dc-back:hover{background:rgba(255,255,255,0.18)}
</style>
<style>
body{margin:0}
a{color:#2B1D52}a:hover{color:#1A1035}
</style>
</head>
<body>
<a class="dc-back" href="../index.html">&#8592; All screens</a>
<div id="dc-root"></div>
<template id="dc-template">
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; padding: 28px 15px 32px; display: flex; flex-direction: column; gap: 22px; background: #FFC93C; color: #2B1D52; font-family: 'Pixelify Sans', 'Courier New', monospace; overflow: hidden">
  <div aria-hidden="true" style="display: flex; justify-content: space-between; align-items: flex-end">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 16px; font-weight: 500">Score</span>
      <span style="font-size: 46px; line-height: 1; font-weight: 700">000420</span>
    </div>
    <span style="font-size: 24px; line-height: 1; font-weight: 700; padding: 6px 10px; border-radius: 8px; background: #2B1D52; color: #FFF1D6">001480</span>
  </div>
  <div aria-hidden="true" style="position: relative; width: 360px; height: 360px; margin-top: 52px; border-radius: 6px; background: repeating-conic-gradient(#1F6E7A 0 25%, #1A6170 0 50%) 0 0 / 36px 36px; box-shadow: 0 0 0 6px #2B1D52, 0 12px 0 6px #1A1035">
    <sc-for list="{{segs}}" as="s" hint-placeholder-count="14">
      <div style="position: absolute; left: {{s.l}}px; top: {{s.t}}px; width: 18px; height: 18px; border-radius: 4px; background: {{s.bg}}; box-shadow: inset 0 -3px 0 rgba(43,29,82,0.25)"></div>
    </sc-for>
  </div>
  <div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; display: flex; align-items: center; justify-content: center; background: rgba(43,29,82,0.8)">
    <div role="dialog" aria-label="Paused" style="width: 330px; box-sizing: border-box; padding: 22px; display: flex; flex-direction: column; gap: 14px; border-radius: 20px; border: 4px solid #2B1D52; background: #FFF1D6; box-shadow: 0 8px 0 #1A1035">
      <h2 style="margin: 0; text-align: center; font-size: 38px; line-height: 1; font-weight: 700">Paused</h2>
      <div style="display: flex; flex-direction: column; gap: 10px">
        <a href="toybox-gameplay.html" style="height: 56px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: #2B1D52; color: #FFF1D6; font-size: 22px; font-weight: 700; text-decoration: none; box-shadow: 0 5px 0 #1A1035">Resume</a>
        <a href="toybox-gameplay.html" style="height: 48px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 12px; border: 3px solid #2B1D52; background: #FFC93C; color: #2B1D52; font-size: 18px; font-weight: 700; text-decoration: none; box-shadow: 0 4px 0 #1A1035">Restart</a>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 15px; font-weight: 600">Controls</span>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
          <sc-for list="{{controls}}" as="c" hint-placeholder-count="3">
            <sc-if value="{{c.sel}}" hint-placeholder-val="{{false}}">
              <button onClick="{{c.pick}}" aria-pressed="true" style="height: 44px; padding: 0; border-radius: 10px; border: 3px solid #2B1D52; background: #FF6B4A; color: #2B1D52; font-family: inherit; font-size: 17px; font-weight: 700; cursor: pointer">{{c.label}}</button>
            </sc-if>
            <sc-if value="{{c.unsel}}" hint-placeholder-val="{{true}}">
              <button onClick="{{c.pick}}" aria-pressed="false" style="height: 44px; padding: 0; border-radius: 10px; border: 3px solid #2B1D52; background: #FFF1D6; color: #2B1D52; font-family: inherit; font-size: 17px; font-weight: 600; cursor: pointer">{{c.label}}</button>
            </sc-if>
          </sc-for>
        </div>
        <sc-if value="{{tiltSel}}" hint-placeholder-val="{{true}}">
          <div style="display: flex; flex-direction: column; gap: 4px">
            <button style="height: 44px; border-radius: 10px; border: 3px dashed #2B1D52; background: transparent; color: #2B1D52; font-family: inherit; font-size: 17px; font-weight: 700; cursor: pointer">Recalibrate tilt</button>
            <span style="font-size: 13px; font-weight: 500; text-align: center">Hold it how you like to play, then tap.</span>
          </div>
        </sc-if>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; justify-content: space-between; align-items: center; min-height: 44px">
          <span style="font-size: 18px; font-weight: 600">Sound</span>
          <sc-if value="{{soundOn}}" hint-placeholder-val="{{true}}">
            <button onClick="{{toggleSound}}" aria-label="Sound" aria-pressed="true" style="width: 60px; height: 34px; box-sizing: border-box; position: relative; padding: 0; border-radius: 8px; border: 3px solid #2B1D52; background: #FF6B4A; cursor: pointer"><span style="position: absolute; left: 28px; top: 3px; width: 22px; height: 22px; border-radius: 4px; background: #2B1D52"></span></button>
          </sc-if>
          <sc-if value="{{soundOff}}" hint-placeholder-val="{{false}}">
            <button onClick="{{toggleSound}}" aria-label="Sound" aria-pressed="false" style="width: 60px; height: 34px; box-sizing: border-box; position: relative; padding: 0; border-radius: 8px; border: 3px solid #2B1D52; background: #FFF1D6; cursor: pointer"><span style="position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; border-radius: 4px; background: #2B1D52"></span></button>
          </sc-if>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; min-height: 44px">
          <span style="font-size: 18px; font-weight: 600">Music</span>
          <sc-if value="{{musicOn}}" hint-placeholder-val="{{false}}">
            <button onClick="{{toggleMusic}}" aria-label="Music" aria-pressed="true" style="width: 60px; height: 34px; box-sizing: border-box; position: relative; padding: 0; border-radius: 8px; border: 3px solid #2B1D52; background: #FF6B4A; cursor: pointer"><span style="position: absolute; left: 28px; top: 3px; width: 22px; height: 22px; border-radius: 4px; background: #2B1D52"></span></button>
          </sc-if>
          <sc-if value="{{musicOff}}" hint-placeholder-val="{{true}}">
            <button onClick="{{toggleMusic}}" aria-label="Music" aria-pressed="false" style="width: 60px; height: 34px; box-sizing: border-box; position: relative; padding: 0; border-radius: 8px; border: 3px solid #2B1D52; background: #FFF1D6; cursor: pointer"><span style="position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; border-radius: 4px; background: #2B1D52"></span></button>
          </sc-if>
        </div>
      </div>
      <a href="toybox-title.html" style="height: 44px; display: flex; align-items: center; justify-content: center; color: #2B1D52; font-size: 17px; font-weight: 600; text-decoration: underline; text-underline-offset: 4px">Quit to menu</a>
    </div>
  </div>
</div>
</template>
<script src="dc-lite.js"></script>
<script>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const control = s.control || 'tilt';
    const sound = s.sound !== undefined ? s.sound : true;
    const music = s.music !== undefined ? s.music : false;
    const C = 18;
    const cells = [[12,8],[11,8],[10,8],[10,9],[10,10],[10,11],[9,11],[8,11],[7,11],[6,11],[6,10],[6,9],[6,8],[6,7]];
    const segs = cells.map((c, i) => ({ l: c[0] * C, t: c[1] * C, bg: i % 2 === 0 ? '#FF6B4A' : '#FFF1D6' }));
    const opts = [{ id: 'tilt', label: 'Tilt' }, { id: 'swipe', label: 'Swipe' }, { id: 'dpad', label: 'D-pad' }];
    const controls = opts.map((o) => ({ label: o.label, sel: control === o.id, unsel: control !== o.id, pick: () => this.setState({ control: o.id }) }));
    return {
      segs: segs,
      controls: controls,
      tiltSel: control === 'tilt',
      soundOn: sound,
      soundOff: !sound,
      musicOn: music,
      musicOff: !music,
      toggleSound: () => this.setState({ sound: !sound }),
      toggleMusic: () => this.setState({ music: !music })
    };
  }
}
dcBoot(Component, {"$preview": {"width": 390, "height": 844}});
</script>
</body>
</html>
