<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toybox Pixel desktop gameplay</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
html,body{margin:0;background:#26232E}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:56px 32px 32px;box-sizing:border-box}
#dc-root{flex:none}
.dc-back{position:fixed;top:12px;left:12px;z-index:10;font:600 13px system-ui,sans-serif;color:#EDEAF5;text-decoration:none;background:rgba(255,255,255,0.1);padding:8px 12px;border-radius:8px}
.dc-back:hover{background:rgba(255,255,255,0.18)}
</style>
<style>
body{margin:0}
a{color:#2B1D52}a:hover{color:#1A1035}
@keyframes tbBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.tb-food{animation:tbBounce 0.9s ease-in-out infinite}
@keyframes tbRise{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-22px);opacity:0.4}}
.tb-pop{animation:tbRise 1.6s ease-out infinite}
@media (prefers-reduced-motion: reduce){.tb-food,.tb-pop{animation:none}}
</style>
</head>
<body>
<a class="dc-back" href="../index.html">&#8592; All screens</a>
<div id="dc-root"></div>
<template id="dc-template">
<div style="width: 1280px; height: 800px; box-sizing: border-box; padding: 80px 48px; display: grid; grid-template-columns: minmax(0, 1fr) 640px minmax(0, 1fr); gap: 48px; align-items: center; background: #FFC93C; color: #2B1D52; font-family: 'Pixelify Sans', 'Courier New', monospace">
  <div style="display: flex; flex-direction: column; gap: 22px; align-items: flex-start">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 20px; font-weight: 500">Score</span>
      <span style="font-size: 64px; line-height: 1; font-weight: 700; letter-spacing: 0.02em">000420</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 20px; font-weight: 500">Best</span>
      <span style="font-size: 30px; line-height: 1; font-weight: 700; padding: 8px 12px; border-radius: 10px; background: #2B1D52; color: #FFF1D6">001480</span>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 10px">
      <span style="padding: 8px 14px; border-radius: 10px; background: #2B1D52; color: #FFF1D6; font-size: 20px; font-weight: 600">Classic</span>
      <span style="padding: 8px 14px; border-radius: 10px; background: #FF6B4A; color: #2B1D52; font-size: 20px; font-weight: 700">Combo x3</span>
    </div>
  </div>
  <div role="img" aria-label="Game board: the striped snake heads right towards a blueberry" style="position: relative; width: 640px; height: 640px; border-radius: 10px; background: repeating-conic-gradient(#1F6E7A 0 25%, #1A6170 0 50%) 0 0 / 64px 64px; box-shadow: 0 0 0 8px #2B1D52, 0 16px 0 8px #1A1035">
    <sc-for list="{{segs}}" as="s" hint-placeholder-count="14">
      <div style="position: absolute; left: {{s.l}}px; top: {{s.t}}px; width: 32px; height: 32px; border-radius: 7px; background: {{s.bg}}; box-shadow: inset 0 -5px 0 rgba(43,29,82,0.25)"></div>
    </sc-for>
    <div style="position: absolute; left: 416px; top: 256px; width: 32px; height: 32px; border-radius: 10px; background: #FF6B4A; box-shadow: inset 0 -5px 0 rgba(43,29,82,0.28)">
      <div style="position: absolute; left: 16px; top: 4px; width: 10px; height: 10px; border-radius: 2px; background: #FFFFFF"></div>
      <div style="position: absolute; left: 16px; top: 18px; width: 10px; height: 10px; border-radius: 2px; background: #FFFFFF"></div>
      <div style="position: absolute; left: 21px; top: 6px; width: 5px; height: 5px; background: #2B1D52"></div>
      <div style="position: absolute; left: 21px; top: 20px; width: 5px; height: 5px; background: #2B1D52"></div>
      <div style="position: absolute; left: 32px; top: 14px; width: 10px; height: 3px; background: #FF2E63"></div>
    </div>
    <div class="tb-food" style="position: absolute; left: 516px; top: 260px; width: 24px; height: 24px">
      <div style="position: absolute; left: 0; top: 0; width: 24px; height: 24px; border-radius: 50%; background: #4C6BFF; box-shadow: inset -3px -3px 0 rgba(43,29,82,0.35)"></div>
      <div style="position: absolute; left: 5px; top: 5px; width: 6px; height: 6px; border-radius: 1px; background: #DDE3FF"></div>
      <div style="position: absolute; left: 8px; top: -6px; width: 10px; height: 6px; border-radius: 3px; background: #5BD16A"></div>
    </div>
    <span class="tb-pop" style="position: absolute; left: 364px; top: 166px; font-size: 28px; font-weight: 700; color: #FFF1D6; text-shadow: 3px 3px 0 #2B1D52">+30</span>
  </div>
  <div style="display: flex; flex-direction: column; gap: 22px; align-items: flex-start">
    <h2 style="margin: 0; font-size: 22px; font-weight: 700">Controls</h2>
    <div style="display: flex; flex-direction: column; gap: 10px; align-items: flex-start">
      <div role="img" aria-label="Arrow keys, currently moving right" style="display: grid; grid-template-columns: repeat(3, 52px); gap: 6px">
        <div style="width: 52px; height: 52px"></div>
        <div style="width: 52px; height: 52px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 10px; border: 3px solid #2B1D52; background: #FFF1D6; box-shadow: 0 4px 0 #1A1035"><svg width="16" height="16" viewBox="0 0 16 16" fill="#2B1D52" aria-hidden="true"><polygon points="8,2 15,13 1,13"></polygon></svg></div>
        <div style="width: 52px; height: 52px"></div>
        <div style="width: 52px; height: 52px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 10px; border: 3px solid #2B1D52; background: #FFF1D6; box-shadow: 0 4px 0 #1A1035"><svg width="16" height="16" viewBox="0 0 16 16" fill="#2B1D52" aria-hidden="true"><polygon points="2,8 13,1 13,15"></polygon></svg></div>
        <div style="width: 52px; height: 52px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 10px; border: 3px solid #2B1D52; background: #FFF1D6; box-shadow: 0 4px 0 #1A1035"><svg width="16" height="16" viewBox="0 0 16 16" fill="#2B1D52" aria-hidden="true"><polygon points="8,14 15,3 1,3"></polygon></svg></div>
        <div style="width: 52px; height: 52px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 10px; border: 3px solid #2B1D52; background: #FF6B4A; box-shadow: 0 1px 0 #1A1035; transform: translateY(3px)"><svg width="16" height="16" viewBox="0 0 16 16" fill="#2B1D52" aria-hidden="true"><polygon points="14,8 3,1 3,15"></polygon></svg></div>
      </div>
      <span style="font-size: 18px; font-weight: 500">or W A S D</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: center; gap: 12px">
        <span style="min-width: 76px; height: 40px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; padding: 0 10px; border-radius: 8px; border: 3px solid #2B1D52; background: #FFF1D6; font-size: 16px; font-weight: 700; box-shadow: 0 3px 0 #1A1035">Space</span>
        <span style="font-size: 18px; font-weight: 500">Pause</span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px">
        <span style="min-width: 76px; height: 40px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; padding: 0 10px; border-radius: 8px; border: 3px solid #2B1D52; background: #FFF1D6; font-size: 16px; font-weight: 700; box-shadow: 0 3px 0 #1A1035">Esc</span>
        <span style="font-size: 18px; font-weight: 500">Menu</span>
      </div>
    </div>
    <span style="font-size: 17px; font-weight: 500; line-height: 1.4">Gamepad works too: d-pad or left stick to steer, Start to pause.</span>
  </div>
</div>
</template>
<script src="dc-lite.js"></script>
<script>
class Component extends DCLogic {
  renderVals() {
    const C = 32;
    const cells = [[12,8],[11,8],[10,8],[10,9],[10,10],[10,11],[9,11],[8,11],[7,11],[6,11],[6,10],[6,9],[6,8],[6,7]];
    const segs = cells.map((c, i) => ({ l: c[0] * C, t: c[1] * C, bg: i % 2 === 0 ? '#FFF1D6' : '#FF6B4A' }));
    return { segs: segs };
  }
}
dcBoot(Component, {"$preview": {"width": 1280, "height": 800}});
</script>
</body>
</html>
