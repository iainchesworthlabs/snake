<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toybox Pixel gameplay</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
html,body{margin:0;background:#26232E}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:56px 32px 32px;box-sizing:border-box}
#dc-root{flex:none}
.dc-back{position:fixed;top:12px;left:12px;z-index:10;font:600 13px system-ui,sans-serif;color:#EDEAF5;text-decoration:none;background:rgba(255,255,255,0.1);padding:8px 12px;border-radius:8px}
.dc-back:hover{background:rgba(255,255,255,0.18)}
</style>
<style>
body{margin:0}
a{color:#2B1D52}a:hover{color:#1A1035}
.tb-board{background:repeating-conic-gradient(#1F6E7A 0 25%,#1A6170 0 50%) 0 0/36px 36px}
@keyframes tbBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.tb-food{animation:tbBounce 0.9s ease-in-out infinite}
@keyframes tbRise{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-14px);opacity:0.4}}
.tb-pop{animation:tbRise 1.6s ease-out infinite}
@media (prefers-reduced-motion: reduce){.tb-food,.tb-pop{animation:none}}
</style>
</head>
<body>
<a class="dc-back" href="../index.html">&#8592; All screens</a>
<div id="dc-root"></div>
<template id="dc-template">
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 28px 15px 32px; display: flex; flex-direction: column; gap: 22px; background: #FFC93C; color: #2B1D52; font-family: 'Pixelify Sans', 'Courier New', monospace">
  <div style="display: flex; justify-content: space-between; align-items: flex-end">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 16px; font-weight: 500">Score</span>
      <span style="font-size: 46px; line-height: 1; font-weight: 700; letter-spacing: 0.02em">000420</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px; align-items: flex-end">
      <span style="font-size: 16px; font-weight: 500">Best</span>
      <span style="font-size: 24px; line-height: 1; font-weight: 700; padding: 6px 10px; border-radius: 8px; background: #2B1D52; color: #FFF1D6">001480</span>
    </div>
  </div>
  <div style="display: flex; justify-content: space-between; align-items: center">
    <div style="display: flex; gap: 10px; align-items: center">
      <span style="padding: 7px 12px; border-radius: 8px; background: #2B1D52; color: #FFF1D6; font-size: 16px; font-weight: 600">Classic</span>
      <span style="padding: 7px 12px; border-radius: 8px; background: #FF6B4A; color: #2B1D52; font-size: 16px; font-weight: 700">Combo x3</span>
    </div>
    <a href="toybox-paused.html" aria-label="Pause" style="width: 44px; height: 44px; border-radius: 10px; background: #2B1D52; color: #FFF1D6; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 #1A1035; text-decoration: none">
      <svg width="16" height="18" viewBox="0 0 16 18" fill="currentColor" aria-hidden="true"><rect x="1" y="1" width="5" height="16"></rect><rect x="10" y="1" width="5" height="16"></rect></svg>
    </a>
  </div>
  <div class="tb-board" role="img" aria-label="Game board: the striped snake heads right towards a blueberry" style="position: relative; width: 360px; height: 360px; border-radius: 6px; box-shadow: 0 0 0 6px #2B1D52, 0 12px 0 6px #1A1035">
    <sc-for list="{{segs}}" as="s" hint-placeholder-count="14">
      <sc-if value="{{s.even}}" hint-placeholder-val="{{true}}">
        <div style="position: absolute; left: {{s.l}}px; top: {{s.t}}px; width: 18px; height: 18px; border-radius: 4px; background: {{s.bg}}; box-shadow: inset 0 -3px 0 rgba(43,29,82,0.28)"></div>
      </sc-if>
      <sc-if value="{{s.odd}}" hint-placeholder-val="{{false}}">
        <div style="position: absolute; left: {{s.l}}px; top: {{s.t}}px; width: 18px; height: 18px; border-radius: 4px; background: #FFF1D6; box-shadow: inset 0 -3px 0 rgba(43,29,82,0.22)"></div>
      </sc-if>
    </sc-for>
    <div style="position: absolute; left: 234px; top: 144px; width: 18px; height: 18px; border-radius: 6px; background: {{snake}}; box-shadow: inset 0 -3px 0 rgba(43,29,82,0.28)">
      <div style="position: absolute; left: 9px; top: 2px; width: 6px; height: 6px; border-radius: 1px; background: #FFFFFF"></div>
      <div style="position: absolute; left: 9px; top: 10px; width: 6px; height: 6px; border-radius: 1px; background: #FFFFFF"></div>
      <div style="position: absolute; left: 12px; top: 3px; width: 3px; height: 3px; background: #2B1D52"></div>
      <div style="position: absolute; left: 12px; top: 11px; width: 3px; height: 3px; background: #2B1D52"></div>
      <div style="position: absolute; left: 18px; top: 8px; width: 6px; height: 2px; background: #FF2E63"></div>
    </div>
    <div class="tb-food" style="position: absolute; left: 290px; top: 146px; width: 14px; height: 14px">
      <div style="position: absolute; left: 0; top: 0; width: 14px; height: 14px; border-radius: 50%; background: #4C6BFF; box-shadow: inset -2px -2px 0 rgba(43,29,82,0.35)"></div>
      <div style="position: absolute; left: 3px; top: 3px; width: 4px; height: 4px; border-radius: 1px; background: #DDE3FF"></div>
      <div style="position: absolute; left: 5px; top: -4px; width: 6px; height: 4px; border-radius: 2px; background: #5BD16A"></div>
    </div>
    <span class="tb-pop" style="position: absolute; left: 204px; top: 92px; font-size: 18px; font-weight: 700; color: #FFF1D6; text-shadow: 2px 2px 0 #2B1D52">+30</span>
  </div>
  <div style="margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 14px">
    <div role="img" aria-label="Tilt indicator: tilting right" style="position: relative; width: 140px; height: 140px; box-sizing: border-box; border-radius: 28px; border: 4px solid #2B1D52; background: #FFF1D6; box-shadow: 0 6px 0 #1A1035">
      <svg width="132" height="132" viewBox="0 0 132 132" aria-hidden="true" style="position: absolute; left: 0; top: 0">
        <polygon points="66,8 58,18 74,18" fill="rgba(43,29,82,0.35)"></polygon>
        <polygon points="66,124 58,114 74,114" fill="rgba(43,29,82,0.35)"></polygon>
        <polygon points="8,66 18,58 18,74" fill="rgba(43,29,82,0.35)"></polygon>
        <polygon points="124,66 114,58 114,74" fill="#2B1D52"></polygon>
      </svg>
      <div style="position: absolute; left: 40px; top: 40px; width: 52px; height: 52px; box-sizing: border-box; border-radius: 50%; border: 3px dashed rgba(43,29,82,0.35)"></div>
      <div style="position: absolute; left: 85px; top: 53px; width: 26px; height: 26px; box-sizing: border-box; border-radius: 50%; border: 3px solid #2B1D52; background: {{snake}}">
        <div style="position: absolute; left: 3px; top: 3px; width: 6px; height: 6px; border-radius: 2px; background: #FFF1D6"></div>
      </div>
    </div>
    <span style="font-size: 18px; font-weight: 500">Tilt to steer. Level out to cruise.</span>
  </div>
</div>
</template>
<script src="dc-lite.js"></script>
<script>
class Component extends DCLogic {
  renderVals() {
    const snake = this.props.snakeColor ?? '#FF6B4A';
    const C = 18;
    const cells = [[13,8],[12,8],[11,8],[10,8],[10,9],[10,10],[10,11],[9,11],[8,11],[7,11],[6,11],[6,10],[6,9],[6,8],[6,7]];
    const segs = cells.slice(1).map((c, i) => ({ l: c[0] * C, t: c[1] * C, even: i % 2 === 1, odd: i % 2 === 0, bg: snake }));
    return { snake: snake, segs: segs };
  }
}
dcBoot(Component, {"snakeColor": {"editor": "color", "default": "#FF6B4A", "options": ["#FF6B4A", "#4C6BFF", "#3FB950", "#B266FF"]}, "$preview": {"width": 390, "height": 844}});
</script>
</body>
</html>
