<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toybox Pixel new high score</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
html,body{margin:0;background:#26232E}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:56px 32px 32px;box-sizing:border-box}
#dc-root{flex:none}
.dc-back{position:fixed;top:12px;left:12px;z-index:10;font:600 13px system-ui,sans-serif;color:#EDEAF5;text-decoration:none;background:rgba(255,255,255,0.1);padding:8px 12px;border-radius:8px}
.dc-back:hover{background:rgba(255,255,255,0.18)}
</style>
<style>
body{margin:0}
a{color:#2B1D52}a:hover{color:#1A1035}
@keyframes tbBlink{50%{background:#FFF1D6}}
.tb-cursor{animation:tbBlink 1s steps(1) infinite}
@media (prefers-reduced-motion: reduce){.tb-cursor{animation:none}}
</style>
</head>
<body>
<a class="dc-back" href="../index.html">&#8592; All screens</a>
<div id="dc-root"></div>
<template id="dc-template">
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 30px 15px 34px; display: flex; flex-direction: column; gap: 18px; background: #FFC93C; color: #2B1D52; font-family: 'Pixelify Sans', 'Courier New', monospace">
  <div style="display: flex; flex-direction: column; gap: 6px; align-items: center; text-align: center">
    <h1 style="margin: 0; font-size: 34px; font-weight: 700">New high score!</h1>
    <span style="font-size: 58px; line-height: 1; font-weight: 700; letter-spacing: 0.02em; color: #FFF1D6; text-shadow: 4px 4px 0 #2B1D52">001250</span>
  </div>
  <ol style="list-style: none; margin: 0; padding: 6px; display: flex; flex-direction: column; gap: 2px; border-radius: 16px; border: 4px solid #2B1D52; background: #FFF1D6; box-shadow: 0 6px 0 #1A1035; font-size: 18px; font-weight: 600">
    <li style="display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; align-items: center; padding: 6px 10px"><span>2</span><span>DAD</span><span>001310</span></li>
    <li style="display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; align-items: center; padding: 6px 10px; border-radius: 10px; background: #FF6B4A; font-weight: 700"><span>3</span><span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{shown}}</span><span>001250</span></li>
    <li style="display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; align-items: center; padding: 6px 10px"><span>4</span><span>LEO</span><span>000980</span></li>
  </ol>
  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; font-size: 16px; font-weight: 600">
      <span>Your name</span>
      <span>{{count}}</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px">
      <sc-for list="{{slots}}" as="s" hint-placeholder-count="12">
        <sc-if value="{{s.active}}" hint-placeholder-val="{{false}}">
          <span class="tb-cursor" style="height: 42px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 6px; border: 3px solid #2B1D52; background: #FF6B4A; font-size: 22px; font-weight: 700">{{s.ch}}</span>
        </sc-if>
        <sc-if value="{{s.idle}}" hint-placeholder-val="{{true}}">
          <span style="height: 42px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 6px; border: 3px solid #2B1D52; background: #FFF1D6; font-size: 22px; font-weight: 700">{{s.ch}}</span>
        </sc-if>
      </sc-for>
    </div>
  </div>
  <div style="display: flex; align-items: center; gap: 12px">
    <span style="font-size: 16px; font-weight: 600">Recent</span>
    <div style="display: flex; gap: 8px">
      <sc-for list="{{recents}}" as="r" hint-placeholder-count="3">
        <button onClick="{{r.pick}}" style="height: 44px; padding: 0 16px; border-radius: 10px; border: 3px solid #2B1D52; background: #FFF1D6; color: #2B1D52; font-family: inherit; font-size: 18px; font-weight: 700; box-shadow: 0 3px 0 #1A1035; cursor: pointer">{{r.label}}</button>
      </sc-for>
    </div>
  </div>
  <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
    <sc-for list="{{keys}}" as="k" hint-placeholder-count="28">
      <sc-if value="{{k.focused}}" hint-placeholder-val="{{false}}">
        <button aria-label="{{k.aria}}" onClick="{{k.pick}}" style="height: 46px; padding: 0; border-radius: 10px; border: 3px solid #2B1D52; background: #FF6B4A; color: #2B1D52; font-family: inherit; font-size: 20px; font-weight: 700; box-shadow: 0 3px 0 #1A1035; cursor: pointer">{{k.label}}</button>
      </sc-if>
      <sc-if value="{{k.plain}}" hint-placeholder-val="{{true}}">
        <button aria-label="{{k.aria}}" onClick="{{k.pick}}" style="height: 46px; padding: 0; border-radius: 10px; border: 3px solid #2B1D52; background: #FFF1D6; color: #2B1D52; font-family: inherit; font-size: 20px; font-weight: 700; box-shadow: 0 3px 0 #1A1035; cursor: pointer">{{k.label}}</button>
      </sc-if>
    </sc-for>
  </div>
  <div style="margin-top: auto; display: flex; flex-direction: column">
    <sc-if value="{{notSaved}}" hint-placeholder-val="{{true}}">
      <button onClick="{{save}}" style="height: 56px; border-radius: 14px; border: none; background: #2B1D52; color: #FFF1D6; font-family: inherit; font-size: 22px; font-weight: 700; box-shadow: 0 5px 0 #1A1035; cursor: pointer">Save score</button>
    </sc-if>
    <sc-if value="{{saved}}" hint-placeholder-val="{{false}}">
      <div style="height: 56px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 14px; border: 4px solid #2B1D52; background: #FFF1D6; font-size: 18px; font-weight: 700">Saved! You’re 3rd on this device.</div>
    </sc-if>
  </div>
</div>
</template>
<script src="dc-lite.js"></script>
<script>
class Component extends DCLogic {
  current() {
    const s = this.state || {};
    return {
      name: s.name !== undefined ? s.name : 'MAYA',
      focus: s.focus !== undefined ? s.focus : 0,
      saved: !!s.saved
    };
  }
  press(i, value) {
    const cur = this.current();
    if (value === 'DEL') {
      this.setState({ name: cur.name.slice(0, -1), focus: i, saved: false });
      return;
    }
    if (cur.name.length >= 12) {
      this.setState({ focus: i });
      return;
    }
    this.setState({ name: cur.name + value, focus: i, saved: false });
  }
  renderVals() {
    const cur = this.current();
    const base = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map((c) => ({ label: c, value: c, aria: c }));
    base.push({ label: 'Spc', value: ' ', aria: 'Space' });
    base.push({ label: 'Del', value: 'DEL', aria: 'Delete last letter' });
    const keys = base.map((k, i) => ({
      label: k.label,
      aria: k.aria,
      focused: i === cur.focus,
      plain: i !== cur.focus,
      pick: () => this.press(i, k.value)
    }));
    const slots = [];
    for (let i = 0; i < 12; i++) {
      const ch = cur.name[i];
      slots.push({ ch: ch && ch !== ' ' ? ch : '', active: i === cur.name.length, idle: i !== cur.name.length });
    }
    const recents = ['MUM', 'DAD', 'LEO'].map((n) => ({ label: n, pick: () => this.setState({ name: n, saved: false }) }));
    return {
      keys: keys,
      slots: slots,
      recents: recents,
      count: cur.name.length + ' of 12',
      shown: cur.name.trim() || 'You',
      saved: cur.saved,
      notSaved: !cur.saved,
      save: () => this.setState({ saved: true })
    };
  }
}
dcBoot(Component, {"$preview": {"width": 390, "height": 844}});
</script>
</body>
</html>
