version = 1

# Files without an SPDX header take the licence below; files with a header keep theirs.
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "Iain Chesworth Labs contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = ["docs/design/fonts/*.woff2", "docs/design/fonts/LICENSE-pixelify-sans.txt"]
precedence = "override"
SPDX-FileCopyrightText = "The Pixelify Sans Project Authors (https://github.com/eifetx/Pixelify-Sans)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["apps/snake/fonts/*.woff2", "apps/snake/fonts/LICENSE-noto-sans.txt"]
precedence = "override"
SPDX-FileCopyrightText = ["Adobe (http://www.adobe.com/), with Reserved Font Name 'Source' (Noto Sans JP and SC)", "The Noto Project Authors (https://github.com/notofonts/hebrew) (Noto Sans Hebrew)"]
SPDX-License-Identifier = "OFL-1.1"
