name: Release

# Runs on a tag pushed from develop. Builds the packages for each platform, signs the Windows
# ones according to the SIGN_WINDOWS repository variable, then hands them to the shared
# publish workflow, which checks the tag, signs, attests and publishes.

on:
  push:
    tags: ["v*"]
  # Builds and uploads the packages from a branch without publishing, to try the packaging
  # (`gh workflow run release.yml --ref <branch>`). The version check and the publish job run for tags only.
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: >-
          Upload the iOS build to TestFlight (a tag always does). Without it a run on a branch only has Apple validate the build.
          Needs SIGN_IOS_UPLOAD=true.
        type: boolean
        default: false

permissions: {}

jobs:
  version:
    name: Check the version
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare the tag with the project version
        env:
          TAG: ${{ github.ref_name }}
        run: python3 tools/ci/check_release_version.py "$TAG"
      - name: Work out the version
        id: tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
      - name: Check the release has notes
        uses: iainchesworthlabs/icl-common-infra/actions/release-notes@e15f14812b7446517252d6677abf755698d57986 # v0.1.18
        with:
          version: ${{ steps.tag.outputs.version }}
          prerelease: ${{ steps.tag.outputs.prerelease }}
          output-file: ${{ runner.temp }}/notes.md

  package:
    name: Package (${{ matrix.name }})
    needs: version
    if: ${{ !cancelled() && (needs.version.result == 'success' || needs.version.result == 'skipped') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - {name: linux-x86_64, runner: ubuntu-26.04, preset: linux-release, config: ""}
          - {name: macos-arm64, runner: macos-26, preset: macos-release, config: ""}
          - {name: windows-x86_64, runner: windows-2025, preset: windows-msvc-release, config: Release}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install GCC
        if: runner.os == 'Linux'
        uses: iainchesworthlabs/icl-common-infra/actions/setup-gcc@e15f14812b7446517252d6677abf755698d57986 # v0.1.18
      - name: Load the MSVC environment
        if: runner.os == 'Windows'
        uses: iainchesworthlabs/icl-common-infra/actions/setup-msvc-env@e15f14812b7446517252d6677abf755698d57986 # v0.1.18
      - name: Set up CMake
        uses: iainchesworthlabs/icl-common-infra/actions/setup-cmake@e15f14812b7446517252d6677abf755698d57986 # v0.1.18
      - name: Set up Qt
        uses: iainchesworthlabs/icl-common-infra/actions/setup-qt@e15f14812b7446517252d6677abf755698d57986 # v0.1.18
      - name: Set up vcpkg
        uses: iainchesworthlabs/icl-common-infra/actions/setup-vcpkg@e15f14812b7446517252d6677abf755698d57986 # v0.1.18
      - name: Set up ccache
        uses: iainchesworthlabs/icl-common-infra/actions/setup-ccache@e15f14812b7446517252d6677abf755698d57986 # v0.1.18
        with:
          key: release-${{ matrix.name }}
      - name: Configure, build and install
        shell: bash
        env:
          PRESET: ${{ matrix.preset }}
          CONFIG: ${{ matrix.config }}
        run: |
          set -euo pipefail
          cmake --preset "$PRESET"
          if [ -n "$CONFIG" ]; then
            cmake --build --preset "$PRESET" --config "$CONFIG"
            cmake --install "build/$PRESET" --config "$CONFIG" --prefix stage
          else
            cmake --build --preset "$PRESET"
            cmake --install "build/$PRESET" --prefix stage
          fi
      - name: Run the installed program
        shell: bash
        run: |
          # The version needs no window system, so this runs on a runner without a display. It fails when the package
          # lacks a library the program is linked to, or the program does not start.
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            exe="$(find stage -name snake.exe | head -n 1)"
          else
            exe="$(find stage -type f -name snake -perm -u+x | head -n 1)"
          fi
          test -n "$exe"
          "$exe" --version | tee version.txt
          grep -q '^snake [0-9]' version.txt
      - name: Check the glibc the package needs
        if: runner.os == 'Linux'
        uses: iainchesworthlabs/icl-common-infra/actions/check-glibc-floor@e15f14812b7446517252d6677abf755698d57986 # v0.1.18
        with:
          folder: stage
      - name: Sign the Windows binaries
        id: sign
        if: runner.os == 'Windows'
        uses: iainchesworthlabs/icl-common-infra/actions/sign-windows@e15f14812b7446517252d6677abf755698d57986 # v0.1.18
        with:
          mode: ${{ vars.SIGN_WINDOWS || 'false' }}
          files: stage/bin/snake.exe
          pfx-base64: ${{ secrets.WIN_TESTSIGN_PFX_BASE64 }}
          pfx-password: ${{ secrets.WIN_TESTSIGN_PFX_PASSWORD }}
      - name: Archive
        shell: bash
        env:
          NAME: snake-${{ github.ref_type == 'tag' && github.ref_name || 'dry-run' }}-${{ matrix.name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "dist/$NAME.zip" ./stage/*
          else
            tar -C stage -czf "dist/$NAME.tar.gz" .
          fi
      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  # The iPhone and iPad application, signed with the Apple Distribution certificate (organisation secrets) and this
  # repository's own provisioning profile, through the shared signing actions (docs/ios-signing.md in icl-common-infra).
  # Two ways to use it, by repository variable:
  #
  #   SIGN_IOS_UPLOAD=true  TestFlight. The profile is an App Store one (no devices), the build number is the number of this
  #                         run, and Apple validates the build; a tag, or a manual run with `upload_testflight`, uploads it.
  #                         Testers install it from the TestFlight app (docs/ios-install.md). Nothing identifies a device.
  #   SIGN_IOS_ADHOC=true   Ad hoc. The profile is an ad-hoc one: the IPA installs only on the devices it lists, and it
  #                         carries the UDIDs of those devices. It is a workflow artifact, or goes to the release if
  #                         IOS_IPA_ON_RELEASE is true. Neither is private in a public repository: any signed-in GitHub
  #                         account can download an artifact.
  #
  # With both unset the release is made without iOS, as before. SIGN_IOS_UPLOAD wins when both are set.
  ios:
    name: Package (iOS)
    needs: version
    if: ${{ !cancelled() && (needs.version.result == 'success' || needs.version.result == 'skipped') && (vars.SIGN_IOS_UPLOAD == 'true' || vars.SIGN_IOS_ADHOC == 'true') }}
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      BUNDLE_ID: com.iainchesworthlabs.snake
      # app-store for TestFlight, ad-hoc otherwise.
      METHOD: ${{ vars.SIGN_IOS_UPLOAD == 'true' && 'app-store' || 'ad-hoc' }}
      VCPKG_DISABLE_METRICS: "1"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The shared action names the secret that is missing, before a Qt download of several gigabytes.
      - name: Import the certificate and the provisioning profile
        id: signing
        uses: iainchesworthlabs/icl-common-infra/actions/import-ios-signing@e15f14812b7446517252d6677abf755698d57986 # v0.1.18
        with:
          certificate-base64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          certificate-password: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          profile-base64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          bundle-id: ${{ env.BUNDLE_ID }}
          method: ${{ env.METHOD }}

      - name: Set up vcpkg
        uses: iainchesworthlabs/icl-common-infra/actions/setup-vcpkg@e15f14812b7446517252d6677abf755698d57986 # v0.1.18

      - name: Set up CMake
        uses: iainchesworthlabs/icl-common-infra/actions/setup-cmake@e15f14812b7446517252d6677abf755698d57986 # v0.1.18

      # Qt's iOS kit, and the macOS kit that aqtinstall's --autodesktop installs beside it for the host tools (as ios-build.yml).
      - name: Install Qt (iOS kit and macOS host kit)
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: "6.12.0"
          host: mac
          target: ios
          arch: ios
          dir: ${{ runner.temp }}
          aqtsource: "git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7"
          modules: "qtsensors"
          cache: false

      - name: Name the Qt kits
        shell: bash
        run: |
          echo "QT_ROOT_DIR=$RUNNER_TEMP/Qt/6.12.0/ios" >> "$GITHUB_ENV"
          echo "QT_HOST_PATH=$RUNNER_TEMP/Qt/6.12.0/macos" >> "$GITHUB_ENV"

      # Signed for the application alone (apps/snake/packaging/mobile.cmake says why). CMake makes no Xcode scheme unless
      # asked, and `xcodebuild archive` takes only a scheme.
      - name: Configure (signed)
        shell: bash
        env:
          TEAM_ID: ${{ steps.signing.outputs.team-id }}
          PROFILE_NAME: ${{ steps.signing.outputs.profile-name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: >
          cmake --preset ios-release
          -DCMAKE_XCODE_GENERATE_SCHEME=ON
          -DSNAKE_IOS_BUILD_NUMBER="$BUILD_NUMBER"
          -DSNAKE_IOS_SIGNING_TEAM="$TEAM_ID"
          -DSNAKE_IOS_SIGNING_PROFILE="$PROFILE_NAME"

      - name: Name the package
        id: name
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          label=dry-run
          if [ "$REF_TYPE" = tag ]; then label="$REF_NAME"; fi
          project="$(find build/ios-release -maxdepth 1 -name '*.xcodeproj' | head -n 1)"
          [ -n "$project" ] || { echo "::error::CMake made no .xcodeproj under build/ios-release"; exit 1; }
          echo "project=$project" >> "$GITHUB_OUTPUT"
          kind=adhoc
          if [ "$METHOD" = app-store ]; then kind=appstore; fi
          echo "ipa=dist-ios/snake-$label-ios-$kind.ipa" >> "$GITHUB_OUTPUT"
          echo "url=https://github.com/$REPOSITORY/releases/download/$label/snake-$label-ios-$kind.ipa" >> "$GITHUB_OUTPUT"
          echo "version=${label#v}" >> "$GITHUB_OUTPUT"

      - name: Archive and export the IPA
        id: export
        uses: iainchesworthlabs/icl-common-infra/actions/export-ios-ipa@e15f14812b7446517252d6677abf755698d57986 # v0.1.18
        with:
          project: ${{ steps.name.outputs.project }}
          scheme: snake_app
          bundle-id: ${{ env.BUNDLE_ID }}
          team-id: ${{ steps.signing.outputs.team-id }}
          profile-name: ${{ steps.signing.outputs.profile-name }}
          method: ${{ env.METHOD }}
          output: ${{ steps.name.outputs.ipa }}
          manifest-ipa-url: ${{ env.METHOD == 'ad-hoc' && steps.name.outputs.url || '' }}
          manifest-title: Snake
          manifest-version: ${{ steps.name.outputs.version }}

      # The signed IPA, opened as a device would: identifier, version, the icon, no permission text, arm64, a valid signature,
      # and an ad-hoc profile for this identifier.
      - name: Check the IPA
        shell: bash
        env:
          IPA: ${{ steps.export.outputs.ipa }}
          VERSION: ${{ steps.name.outputs.version }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          args=(--signed)
          if [ "$METHOD" = app-store ]; then args+=(--store); fi
          if [ "$REF_TYPE" = tag ]; then args+=(--version "${VERSION%%-*}"); fi
          apps/snake/packaging/ios/verify_app.sh "$IPA" "${args[@]}"

      # Apple's own check of the icon, the property list, the signature and the privacy declarations; and, for a tag or a
      # manual run that asks, the upload to TestFlight.
      - name: Validate with Apple, and upload to TestFlight
        if: env.METHOD == 'app-store'
        uses: iainchesworthlabs/icl-common-infra/actions/upload-testflight@e15f14812b7446517252d6677abf755698d57986 # v0.1.18
        with:
          ipa: ${{ steps.export.outputs.ipa }}
          key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          issuer-id: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          validate-only: ${{ github.ref_type != 'tag' && inputs.upload_testflight != true }}

      - name: Remove the signing keychain and profile
        if: always()
        uses: iainchesworthlabs/icl-common-infra/actions/import-ios-signing@e15f14812b7446517252d6677abf755698d57986 # v0.1.18
        with:
          remove: "true"

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Only an artifact named release-* goes to the release (the publish job's pattern).
          name: ${{ env.METHOD == 'app-store' && 'ios-appstore' || (vars.IOS_IPA_ON_RELEASE == 'true' && 'release-ios-adhoc' || 'ios-adhoc') }}
          retention-days: 7
          path: dist-ios/*
          if-no-files-found: error

      - name: Say how to install it
        shell: bash
        env:
          ON_RELEASE: ${{ vars.IOS_IPA_ON_RELEASE }}
          UPLOADED: ${{ github.ref_type == 'tag' || inputs.upload_testflight == true }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          {
            if [ "$METHOD" = app-store ]; then
              echo "### iOS build for TestFlight"
              if [ "$UPLOADED" = true ]; then
                echo "Uploaded as build $BUILD_NUMBER. Apple processes it for a few minutes; then it is in the TestFlight app for the internal testers."
              else
                echo "Validated by Apple, not uploaded. Run the workflow with \`upload_testflight\` (or push a tag) to upload build $BUILD_NUMBER."
              fi
            else
              echo "### iOS ad-hoc IPA"
              if [ "$ON_RELEASE" = true ]; then
                echo "It goes to the release with the other files (docs/ios-install.md)."
              else
                echo "Kept as the workflow artifact \`ios-adhoc\` for 7 days (IOS_IPA_ON_RELEASE is not true). It lists device UDIDs, and in a public repository any signed-in GitHub account can download an artifact."
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish
    needs: [package, ios]
    if: ${{ !cancelled() && github.ref_type == 'tag' && needs.package.result == 'success' && (needs.ios.result == 'success' || needs.ios.result == 'skipped') }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/release-publish.yml@721426d0ced1522f7c690d4ebd3e0d66f550bb8b # v0.1.8
    secrets:
      REPO_GPG_PRIVATE_KEY: ${{ secrets.REPO_GPG_PRIVATE_KEY }}
      REPO_GPG_PASSPHRASE: ${{ secrets.REPO_GPG_PASSPHRASE }}
      RELEASE_BOT_APP_ID: ${{ secrets.RELEASE_BOT_APP_ID }}
      RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
