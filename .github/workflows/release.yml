name: Release

# Runs on a tag pushed from develop. Builds the packages for each platform, signs the Windows
# ones according to the SIGN_WINDOWS repository variable, then hands them to the shared
# publish workflow, which checks the tag, signs, attests and publishes.

on:
  push:
    tags: ["v*"]
  # Builds and uploads the packages from a branch without publishing, to try the packaging
  # (`gh workflow run release.yml --ref <branch>`). The version check and the publish job run for tags only.
  workflow_dispatch:

permissions: {}

jobs:
  version:
    name: Check the version
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare the tag with the project version
        env:
          TAG: ${{ github.ref_name }}
        run: python3 tools/ci/check_release_version.py "$TAG"

  package:
    name: Package (${{ matrix.name }})
    needs: version
    if: ${{ !cancelled() && (needs.version.result == 'success' || needs.version.result == 'skipped') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - {name: linux-x86_64, runner: ubuntu-26.04, preset: linux-release, config: ""}
          - {name: macos-arm64, runner: macos-26, preset: macos-release, config: ""}
          - {name: windows-x86_64, runner: windows-2025, preset: windows-msvc-release, config: Release}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install GCC
        if: runner.os == 'Linux'
        uses: iainchesworthlabs/icl-common-infra/actions/setup-gcc@36ab4ef896c7163ea39b223115e59f0d1c9f50eb # v0.1.4-test
      - name: Load the MSVC environment
        if: runner.os == 'Windows'
        uses: iainchesworthlabs/icl-common-infra/actions/setup-msvc-env@36ab4ef896c7163ea39b223115e59f0d1c9f50eb # v0.1.4-test
      - name: Set up CMake
        uses: iainchesworthlabs/icl-common-infra/actions/setup-cmake@36ab4ef896c7163ea39b223115e59f0d1c9f50eb # v0.1.4-test
      - name: Read the Qt version
        id: qt
        shell: bash
        run: |
          set -euo pipefail
          echo "version=$(python3 -c "import json; print(json.load(open('.github/toolchain-versions.json'))['qt'])")" >> "$GITHUB_OUTPUT"
          echo "aqtsource=$(python3 -c "import json; print(json.load(open('.github/toolchain-versions.json')).get('aqtsource',''))")" >> "$GITHUB_OUTPUT"
      - name: Set up Qt
        uses: iainchesworthlabs/icl-common-infra/actions/setup-qt@36ab4ef896c7163ea39b223115e59f0d1c9f50eb # v0.1.4-test
        with:
          version: ${{ steps.qt.outputs.version }}
          aqtsource: ${{ runner.os == 'Windows' && steps.qt.outputs.aqtsource || '' }}
      - name: Set up vcpkg
        uses: iainchesworthlabs/icl-common-infra/actions/setup-vcpkg@36ab4ef896c7163ea39b223115e59f0d1c9f50eb # v0.1.4-test
      - name: Set up ccache
        uses: iainchesworthlabs/icl-common-infra/actions/setup-ccache@36ab4ef896c7163ea39b223115e59f0d1c9f50eb # v0.1.4-test
        with:
          key: release-${{ matrix.name }}
      - name: Configure, build and install
        shell: bash
        env:
          PRESET: ${{ matrix.preset }}
          CONFIG: ${{ matrix.config }}
        run: |
          set -euo pipefail
          cmake --preset "$PRESET"
          if [ -n "$CONFIG" ]; then
            cmake --build --preset "$PRESET" --config "$CONFIG"
            cmake --install "build/$PRESET" --config "$CONFIG" --prefix stage
          else
            cmake --build --preset "$PRESET"
            cmake --install "build/$PRESET" --prefix stage
          fi
      - name: Sign the Windows binaries
        id: sign
        if: runner.os == 'Windows'
        uses: iainchesworthlabs/icl-common-infra/actions/sign-windows@36ab4ef896c7163ea39b223115e59f0d1c9f50eb # v0.1.4-test
        with:
          mode: ${{ vars.SIGN_WINDOWS || 'false' }}
          files: stage/bin/snake.exe
          pfx-base64: ${{ secrets.WIN_TESTSIGN_PFX_BASE64 }}
          pfx-password: ${{ secrets.WIN_TESTSIGN_PFX_PASSWORD }}
      - name: Archive
        shell: bash
        env:
          NAME: snake-${{ github.ref_type == 'tag' && github.ref_name || 'dry-run' }}-${{ matrix.name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "dist/$NAME.zip" ./stage/*
          else
            tar -C stage -czf "dist/$NAME.tar.gz" .
          fi
      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish
    needs: package
    if: github.ref_type == 'tag'
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/release-publish.yml@36ab4ef896c7163ea39b223115e59f0d1c9f50eb # v0.1.4-test
    secrets:
      REPO_GPG_PRIVATE_KEY: ${{ secrets.REPO_GPG_PRIVATE_KEY }}
      REPO_GPG_PASSPHRASE: ${{ secrets.REPO_GPG_PASSPHRASE }}
      RELEASE_BOT_APP_ID: ${{ secrets.RELEASE_BOT_APP_ID }}
      RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
