name: Release

# Runs on a tag pushed from develop. Builds the packages for each platform, signs the Windows
# ones according to the SIGN_WINDOWS repository variable, then hands them to the shared
# publish workflow, which checks the tag, signs, attests and publishes.

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  version:
    name: Check the version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare the tag with the project version
        env:
          TAG: ${{ github.ref_name }}
        run: python3 tools/ci/check_release_version.py "$TAG"

  package:
    name: Package (${{ matrix.name }})
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - {name: linux-x86_64, runner: ubuntu-24.04, preset: linux-release, config: ""}
          - {name: macos-arm64, runner: macos-15, preset: macos-release, config: ""}
          - {name: windows-x86_64, runner: windows-2025, preset: windows-msvc-release, config: Release}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load the MSVC environment
        if: runner.os == 'Windows'
        uses: iainchesworthlabs/icl-common-infra/actions/setup-msvc-env@e2427041d2c15fc40018eb2155d2bb278d5f615f # v0.1.3
      - name: Set up CMake
        uses: iainchesworthlabs/icl-common-infra/actions/setup-cmake@e2427041d2c15fc40018eb2155d2bb278d5f615f # v0.1.3
      - name: Set up vcpkg
        uses: iainchesworthlabs/icl-common-infra/actions/setup-vcpkg@e2427041d2c15fc40018eb2155d2bb278d5f615f # v0.1.3
      - name: Set up ccache
        uses: iainchesworthlabs/icl-common-infra/actions/setup-ccache@e2427041d2c15fc40018eb2155d2bb278d5f615f # v0.1.3
        with:
          key: release-${{ matrix.name }}
      - name: Configure, build and install
        shell: bash
        env:
          PRESET: ${{ matrix.preset }}
          CONFIG: ${{ matrix.config }}
        run: |
          set -euo pipefail
          cmake --preset "$PRESET"
          if [ -n "$CONFIG" ]; then
            cmake --build --preset "$PRESET" --config "$CONFIG"
            cmake --install "build/$PRESET" --config "$CONFIG" --prefix stage
          else
            cmake --build --preset "$PRESET"
            cmake --install "build/$PRESET" --prefix stage
          fi
      - name: Sign the Windows binaries
        id: sign
        if: runner.os == 'Windows'
        uses: iainchesworthlabs/icl-common-infra/actions/sign-windows@e2427041d2c15fc40018eb2155d2bb278d5f615f # v0.1.3
        with:
          mode: ${{ vars.SIGN_WINDOWS || 'false' }}
          files: stage/bin/icl-template.exe
          pfx-base64: ${{ secrets.WIN_TESTSIGN_PFX_BASE64 }}
          pfx-password: ${{ secrets.WIN_TESTSIGN_PFX_PASSWORD }}
      - name: Archive
        shell: bash
        env:
          NAME: icl-template-${{ github.ref_name }}-${{ matrix.name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "dist/$NAME.zip" ./stage/*
          else
            tar -C stage -czf "dist/$NAME.tar.gz" .
          fi
      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish
    needs: package
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/release-publish.yml@e2427041d2c15fc40018eb2155d2bb278d5f615f # v0.1.3
    secrets:
      REPO_GPG_PRIVATE_KEY: ${{ secrets.REPO_GPG_PRIVATE_KEY }}
      REPO_GPG_PASSPHRASE: ${{ secrets.REPO_GPG_PASSPHRASE }}
      RELEASE_BOT_APP_ID: ${{ secrets.RELEASE_BOT_APP_ID }}
      RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
