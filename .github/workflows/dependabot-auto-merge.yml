name: Dependabot auto-merge

on:
  pull_request:
    branches: [develop]

permissions: {}

jobs:
  auto-merge:
    name: Enable auto-merge
    if: github.actor == 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: write
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/dependabot-auto-merge.yml@36ab4ef896c7163ea39b223115e59f0d1c9f50eb # v0.1.4-test
    secrets:
      MERGE_QUEUE_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
