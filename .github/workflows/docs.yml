name: Docs

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [develop]
    paths: ["docs/**", "mkdocs.yml", "requirements/docs.txt", ".github/workflows/docs.yml", "tools/docs/**"]
  # The site publishes from the branch `site`, which only publish-site.yml moves: it fast-forwards `site` to the tip of
  # develop, by hand. A push to `site` runs this workflow and no other, because ci.yml runs for pull requests, the merge
  # queue and develop. There is no path filter: `site` moves only when someone has asked for the site to go up.
  push:
    branches: [site]

permissions: {}

jobs:
  build:
    name: Build site
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    permissions:
      contents: read
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/docs.yml@37d47f6c680737a399a0f34d281bb4dedc541125 # v0.1.29
    with:
      site-artifact: docs-site

  publish:
    name: Build site for the domain
    if: github.event_name == 'push'
    permissions:
      contents: read
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/docs.yml@37d47f6c680737a399a0f34d281bb4dedc541125 # v0.1.29
    with:
      site-artifact: docs-site

  # Production: https://iainchesworthlabs.com/snake/, from the branch site. The role, bucket and distribution come from
  # the repository secrets DOCS_ROLE_ARN, DOCS_BUCKET and DOCS_DISTRIBUTION_ID (set by the owner). The role's trust
  # policy must allow a push to refs/heads/site of this repository (publishRef 'site' for snake in icl-site). To
  # publish the same commit again, re-run the run of that push.
  deploy:
    name: Deploy site
    needs: publish
    if: github.event_name == 'push'
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/docs-deploy-aws.yml@37d47f6c680737a399a0f34d281bb4dedc541125 # v0.1.29
    with:
      prefix: snake
      production-ref: refs/heads/site
    secrets:
      DOCS_ROLE_ARN: ${{ secrets.DOCS_ROLE_ARN }}
      DOCS_PREVIEW_ROLE_ARN: ${{ secrets.DOCS_PREVIEW_ROLE_ARN }}
      DOCS_BUCKET: ${{ secrets.DOCS_BUCKET }}
      DOCS_DISTRIBUTION_ID: ${{ secrets.DOCS_DISTRIBUTION_ID }}

  # A denied role assumption would otherwise be one red step among many. Say what it means and what to do.
  deploy-failed:
    name: Explain a failed deploy
    needs: deploy
    if: failure() && needs.deploy.result == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Say what to check
        shell: bash
        run: |
          set -euo pipefail
          message="The production docs deploy failed. If the step 'Assume the production role' says the web identity token cannot be assumed or the action is not authorized, the deploy role's trust policy does not allow a push to refs/heads/site of this repository: the owner sets publishRef to site for the snake entry of icl-site (infra/lib/apps.ts), runs the site stack's deploy (cdk deploy), sets the secrets DOCS_ROLE_ARN, DOCS_PREVIEW_ROLE_ARN, DOCS_BUCKET and DOCS_DISTRIBUTION_ID on this repository, then re-runs this run (Actions, Docs, the run of the push to site, Re-run all jobs). If another step failed, read its log. The site stays at its last good version."
          echo "::error title=Docs deploy failed::$message"
          echo "$message" >> "$GITHUB_STEP_SUMMARY"
          exit 1

  # Preview of a pull request from this repository, at https://iainchesworthlabs.com/_preview/snake/pr-<n>/.
  preview:
    name: Deploy preview
    needs: build
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/docs-deploy-aws.yml@37d47f6c680737a399a0f34d281bb4dedc541125 # v0.1.29
    with:
      prefix: snake
      preview: true
      pr-number: ${{ github.event.pull_request.number }}
    secrets:
      DOCS_ROLE_ARN: ${{ secrets.DOCS_ROLE_ARN }}
      DOCS_PREVIEW_ROLE_ARN: ${{ secrets.DOCS_PREVIEW_ROLE_ARN }}
      DOCS_BUCKET: ${{ secrets.DOCS_BUCKET }}
      DOCS_DISTRIBUTION_ID: ${{ secrets.DOCS_DISTRIBUTION_ID }}

  remove-preview:
    name: Remove preview
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/docs-deploy-aws.yml@37d47f6c680737a399a0f34d281bb4dedc541125 # v0.1.29
    with:
      mode: remove-preview
      prefix: snake
      pr-number: ${{ github.event.pull_request.number }}
    secrets:
      DOCS_ROLE_ARN: ${{ secrets.DOCS_ROLE_ARN }}
      DOCS_PREVIEW_ROLE_ARN: ${{ secrets.DOCS_PREVIEW_ROLE_ARN }}
      DOCS_BUCKET: ${{ secrets.DOCS_BUCKET }}
      DOCS_DISTRIBUTION_ID: ${{ secrets.DOCS_DISTRIBUTION_ID }}
