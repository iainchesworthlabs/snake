name: Docs

on:
  pull_request:
    branches: [develop]
    paths: ["docs/**", "mkdocs.yml", "requirements/docs.txt", ".github/workflows/docs.yml"]
  push:
    branches: [main]

permissions: {}

jobs:
  build:
    name: Build site
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/docs.yml@721426d0ced1522f7c690d4ebd3e0d66f550bb8b # v0.1.8

  publish:
    name: Build site for Pages
    if: github.event_name == 'push'
    permissions:
      contents: read
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/docs.yml@721426d0ced1522f7c690d4ebd3e0d66f550bb8b # v0.1.8
    with:
      upload: true

  deploy:
    name: Deploy site
    needs: publish
    if: github.event_name == 'push'
    permissions:
      pages: write
      id-token: write
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/docs-deploy.yml@721426d0ced1522f7c690d4ebd3e0d66f550bb8b # v0.1.8
