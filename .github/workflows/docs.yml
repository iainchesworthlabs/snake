name: Docs

on:
  pull_request:
    branches: [develop]
    paths: ["docs/**", "mkdocs.yml", "requirements/docs.txt", ".github/workflows/docs.yml"]
  push:
    branches: [main]

permissions: {}

jobs:
  build:
    name: Build site
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/docs.yml@e2427041d2c15fc40018eb2155d2bb278d5f615f # v0.1.3

  publish:
    name: Build site for Pages
    if: github.event_name == 'push'
    permissions:
      contents: read
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/docs.yml@e2427041d2c15fc40018eb2155d2bb278d5f615f # v0.1.3
    with:
      upload: true

  deploy:
    name: Deploy site
    needs: publish
    if: github.event_name == 'push'
    permissions:
      pages: write
      id-token: write
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/docs-deploy.yml@e2427041d2c15fc40018eb2155d2bb278d5f615f # v0.1.3
