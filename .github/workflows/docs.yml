name: Docs

on:
  pull_request:
    branches: [develop]
    paths: ["docs/**", "mkdocs.yml", "requirements/docs.txt", ".github/workflows/docs.yml"]
  push:
    branches: [main]

permissions: {}

jobs:
  build:
    name: Build site
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/docs.yml@36ab4ef896c7163ea39b223115e59f0d1c9f50eb # v0.1.4-test

  publish:
    name: Build site for Pages
    if: github.event_name == 'push'
    permissions:
      contents: read
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/docs.yml@36ab4ef896c7163ea39b223115e59f0d1c9f50eb # v0.1.4-test
    with:
      upload: true

  deploy:
    name: Deploy site
    needs: publish
    if: github.event_name == 'push'
    permissions:
      pages: write
      id-token: write
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/docs-deploy.yml@36ab4ef896c7163ea39b223115e59f0d1c9f50eb # v0.1.4-test
